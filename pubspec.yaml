name: carwasher
description: "A casual 2D mobile game built with Flutter."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  google_mobile_ads: ^9.2.0
  in_app_purchase: ^3.3.1
  audioplayers: ^6.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
    - assets/images/icon/
    - assets/images/backgrounds/
    - assets/images/vehicles/
    - assets/images/vehicles/paint/
    - assets/images/tools/
    - assets/images/decals/
    - assets/images/rims/
    - assets/images/ui/
    - assets/images/wheels/
    - assets/images/fx/
    - assets/images/props/
